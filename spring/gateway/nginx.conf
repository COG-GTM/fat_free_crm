# Strangler gateway: all traffic goes to Rails today.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream rails_app {
        server web:3000;
    }

    # ---- BEGIN Spring routing: upstream ----
    # upstream spring_api { server host.docker.internal:8080; }
    # ---- END Spring routing: upstream ----

    # ---- BEGIN Spring routing: accounts ----
    # map $request_method $accounts_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: accounts ----

    # ---- BEGIN Spring routing: users ----
    # map $request_method $users_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: users ----

    # ---- BEGIN Spring routing: me ----
    # map $request_method $me_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: me ----

    # ---- BEGIN Spring routing: home ----
    # map $request_method $home_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: home ----

    # ---- BEGIN Spring routing: admin ----
    # map $request_method $admin_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: admin ----

    # ---- BEGIN Spring routing: metadata ----
    # map $request_method $metadata_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: metadata ----

    server {
        listen 8000;
        server_name _;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /gateway/health {
            return 200 "ok\n";
        }

        # ---- BEGIN Spring routing: accounts ----
        # location ~ ^/api/v1/accounts(/[0-9]+|/autocomplete)?$ {
        #     proxy_pass http://$accounts_upstream;
        # }
        # ---- END Spring routing: accounts ----

        # ---- BEGIN Spring routing: users ----
        # location ~ ^/api/v1/users/([0-9]+|autocomplete)$ {
        #     proxy_pass http://$users_upstream;
        # }
        # ---- END Spring routing: users ----

        # ---- BEGIN Spring routing: me ----
        # location = /api/v1/me {
        #     proxy_pass http://$me_upstream;
        # }
        # ---- END Spring routing: me ----

        # ---- BEGIN Spring routing: home ----
        # location = /api/v1/activities {
        #     proxy_pass http://$home_upstream;
        # }
        # ---- END Spring routing: home ----

        # ---- BEGIN Spring routing: admin ----
        # location ~ ^/api/v1/admin/(users(/[0-9]+)?|groups/[0-9]+|fields/[0-9]+|tags|research_tools)$ {
        #     proxy_pass http://$admin_upstream;
        # }
        # ---- END Spring routing: admin ----

        # ---- BEGIN Spring routing: metadata ----
        # location ~ ^/api/v1/metadata/[a-z_]+$ {
        #     proxy_pass http://$metadata_upstream;
        # }
        # ---- END Spring routing: metadata ----

        location / {
            proxy_pass http://rails_app;
        }
    }
}
