# Strangler gateway: all traffic goes to Rails today.
# To route a resource to Spring, uncomment the marked routing blocks and reload with nginx -s reload.
# Roll back by re-commenting those blocks and reloading nginx.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream rails_app {
        server web:3000;
    }

    # ---- BEGIN Spring routing (disabled until a resource is cut over) ----
    # upstream spring_api { server host.docker.internal:8080; }
    # map $request_method $accounts_upstream {
    #     GET spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing ----

    server {
        listen 8000;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /gateway/health {
            return 200 "ok\n";
        }

        # ---- BEGIN Spring routing (disabled until a resource is cut over) ----
        # location ~ ^/api/v1/accounts(/[0-9]+)?$ {
        #     proxy_pass http://$accounts_upstream;
        # }
        # ---- END Spring routing ----

        location / {
            proxy_pass http://rails_app;
        }
    }
}
