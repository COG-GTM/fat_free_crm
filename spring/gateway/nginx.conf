# Strangler gateway. Everything goes to Rails today: the /api/v1 location is
# present but commented out so cutover is a one-line change per resource
# (uncomment, reload, watch the contract-diff harness) and a one-line rollback.
#
# Not wired into any deployment yet — Phase 1 only needs the config to exist and
# be reviewable. `nginx -t -c` on this file validates it.

worker_processes 1;
events {
    worker_connections 1024;
}

http {
    upstream rails_app {
        server 127.0.0.1:3000;
    }

    upstream spring_api {
        server 127.0.0.1:8080;
    }

    server {
        listen 8000;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Phase 4+: shift one resource at a time, e.g.
        # location = /api/v1/accounts { proxy_pass http://spring_api; }
        # location ~ ^/api/v1/accounts/[0-9]+$ { proxy_pass http://spring_api; }

        # Health/observability of the Spring service is routable from day one so
        # the deployment can be monitored before it serves traffic.
        location /internal/api-health/ {
            proxy_pass http://spring_api/actuator/health/;
        }

        location / {
            proxy_pass http://rails_app;
        }
    }
}
