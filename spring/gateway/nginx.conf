        #     proxy_pass http://$tasks_upstream;
        # }
        # ---- END Spring routing: tasks ----

        # ---- BEGIN Spring routing: comments ----
        # location = /api/v1/comments {
        #     proxy_pass http://$comments_upstream;
        # }
        # ---- END Spring routing: comments ----

        location / {
            proxy_pass http://rails_app;
        }
    }
}
