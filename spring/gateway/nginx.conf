# Strangler gateway: all traffic goes to Rails today.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream rails_app {
        server web:3000;
    }

    # ---- BEGIN Spring routing: upstream ----
    # upstream spring_api { server host.docker.internal:8080; }
    # ---- END Spring routing: upstream ----

    # ---- BEGIN Spring routing: accounts ----
    # map $request_method $accounts_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: accounts ----

    # ---- BEGIN Spring routing: campaigns ----
    # map $request_method $campaigns_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: campaigns ----

    # ---- BEGIN Spring routing: contacts ----
    # map $request_method $contacts_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: contacts ----

    # ---- BEGIN Spring routing: leads ----
    # map $request_method $leads_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: leads ----

    # ---- BEGIN Spring routing: opportunities ----
    # map $request_method $opportunities_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: opportunities ----

    # ---- BEGIN Spring routing: tasks ----
    # map $request_method $tasks_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: tasks ----

    # ---- BEGIN Spring routing: comments ----
    # map $request_method $comments_upstream {
    #     GET spring_api;
    #     HEAD spring_api;
    #     default rails_app;
    # }
    # ---- END Spring routing: comments ----

    server {
        listen 8000;
        server_name _;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /gateway/health {
            return 200 "ok\n";
        }

        # ---- BEGIN Spring routing: accounts ----
        # location ~ ^/api/v1/accounts(/[0-9]+|/autocomplete)?$ {
        #     proxy_pass http://$accounts_upstream;
        # }
        # ---- END Spring routing: accounts ----

        # ---- BEGIN Spring routing: campaigns ----
        # location ~ ^/api/v1/campaigns(/[0-9]+|/autocomplete)?$ {
        #     proxy_pass http://$campaigns_upstream;
        # }
        # ---- END Spring routing: campaigns ----

        # ---- BEGIN Spring routing: contacts ----
        # location ~ ^/api/v1/contacts(/[0-9]+(\.vcf)?|/autocomplete)?$ {
        #     proxy_pass http://$contacts_upstream;
        # }
        # ---- END Spring routing: contacts ----

        # ---- BEGIN Spring routing: leads ----
        # location ~ ^/api/v1/leads(/[0-9]+(\.vcf)?|/autocomplete)?$ {
        #     proxy_pass http://$leads_upstream;
        # }
        # ---- END Spring routing: leads ----

        # ---- BEGIN Spring routing: opportunities ----
        # location ~ ^/api/v1/opportunities(/[0-9]+|/autocomplete)?$ {
