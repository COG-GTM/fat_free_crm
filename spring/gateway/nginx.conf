worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream rails_app {
        server web:3000;
    }

    # Resource migration example: enable this upstream and map only GET traffic
    # for accounts while POST/PUT/PATCH/DELETE continue to Rails.
    # upstream spring_api { server host.docker.internal:8080; }
    # map $request_method $accounts_upstream {
    #     GET spring_api;
    #     default rails_app;
    # }

    server {
        listen 8000;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /gateway/health {
            return 200 "ok\n";
        }

        # Uncomment when the spring_api upstream and http-scope map above are enabled.
        # location ~ ^/api/v1/accounts(/[0-9]+)?$ {
        #     proxy_pass http://$accounts_upstream;
        # }

        location / {
            proxy_pass http://rails_app;
        }
    }
}
