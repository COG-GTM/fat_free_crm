spring:
  application:
    name: fat-free-crm-api
  datasource:
    url: ${FFCRM_DB_URL:jdbc:postgresql://localhost:5432/fat_free_crm_development}
    username: ${FFCRM_DB_USER:postgres}
    password: ${FFCRM_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Rails schema adopted
    validate-on-migrate: true
    clean-disabled: true
springdoc:
  api-docs:
    version: openapi_3_1
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${FFCRM_API_PORT:8080}
  forward-headers-strategy: framework

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: fat-free-crm-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true
    env:
      enabled: false
