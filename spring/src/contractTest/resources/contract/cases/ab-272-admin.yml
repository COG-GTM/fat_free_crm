# AB-272 Phase B admin write cases (app/controllers/admin/). Every case resets the corpus before
# each side (reset: true) and asserts DB rows (dbAssert), including PaperTrail `versions` for User
# (the only has_paper_trail admin model). Non-admins: Rails redirects to / (302), Spring 403
# (allowlist admin-non-admin-302-vs-403). Where Rails persists and then fails on a missing URL
# helper / template (groups, tags, field_groups, fields create; sort), both sides answer 500 and
# the committed rows are asserted. Custom-field cases run runtime DDL: the harness drops columns
# the Rails side added before the Spring side runs, and asserts information_schema.columns.

# ---- users ------------------------------------------------------------------------------------

- id: admin-users-create
  ticket: AB-272
  status: enforced
  method: POST
  path: /admin/users
  auth: admin
  body: {user: {username: dave, email: " Dave@X.Example ", first_name: Dave, last_name: Day,
                password: secret12, password_confirmation: "", group_ids: ["1"]}}
  reset: true
  dbAssert:
    - {table: users, where: "username = 'dave'", exclude: [id],
       volatile: [created_at, updated_at, encrypted_password, password_salt, confirmation_token,
                  confirmation_sent_at]}
    - {table: groups_users, where: "user_id IN (SELECT id FROM users WHERE username = 'dave')",
       orderBy: group_id}
    - {table: versions, where: "item_type = 'User' AND event = 'create'", exclude: [id, item_id],
       volatile: [created_at],
       yamlVolatile: {object_changes: [id, created_at, updated_at, encrypted_password, password_salt,
                                       confirmation_token, confirmation_sent_at]}}
  description: User create → 201 ["Dave"]; email stripped/downcased; HABTM groups; create version.

