# AB-272 Phase B write cases: accounts/campaigns/contacts/leads/opportunities writes including
# attach/discard/subscribe/unsubscribe, promote/reject/convert, comment_body, custom fields,
# tags and permissions. All enforced; every case resets the contract corpus (reset: true) and
# asserts response + DB rows (dbAssert) including PaperTrail versions. Timestamp columns are
# volatile; version YAML timestamps are masked via yamlVolatile.

- id: accounts-create
  ticket: AB-272
  status: enforced
  method: POST
  path: /accounts
  auth: alice
  normalize: {ignore: ["/created_at", "/updated_at"]}
  body: {account: {name: "Contract Account"}}
  reset: true
  dbAssert:
    - {table: accounts, where: "id = 108", exclude: [custom_fields],
       volatile: [created_at, updated_at]}
    - {table: versions, where: "item_type = 'Account' AND item_id = 108", exclude: [id],
       volatile: [created_at],
       yamlVolatile: {object_changes: [created_at, updated_at]}}
  description: Account create → 201 + account JSON (CanCan defaults user/assigned/access) + create version.

