- id: ab273-assigned-account-create-web-no-mail
  ticket: AB-273
  status: enforced
  method: POST
  path: /accounts
  auth: alice
  reset: true
  normalize: {ignore: ["/created_at", "/updated_at"]}
  setup:
    - "UPDATE settings SET value = E'--- crm.contract.example\\n' WHERE name = 'host'"
    - "INSERT INTO settings (name, value, created_at, updated_at) SELECT 'host', E'--- crm.contract.example\\n', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP WHERE NOT EXISTS (SELECT 1 FROM settings WHERE name = 'host')"
  body: {account: {name: "Callback Assigned Account", assigned_to: 3}}
  dbAssert:
    - {table: solid_queue_jobs, columns: [class_name, queue_name, priority, arguments], orderBy: id,
       jsonVolatile: {arguments: [job_id, provider_job_id, enqueued_at, scheduled_at]}}
    - {table: solid_queue_ready_executions, columns: [queue_name, priority], orderBy: job_id}
  description: Web account creation with another assignee enqueues no assignment mail under Rails Integer whodunnit behavior.

