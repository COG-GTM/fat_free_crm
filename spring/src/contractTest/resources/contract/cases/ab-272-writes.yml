# AB-272 Phase A write cases: tasks/comments/emails/lists writes. All enforced; every case resets
# the contract corpus before each side (reset: true) and asserts response + DB rows (dbAssert)
# including PaperTrail `versions`. Timestamp columns are volatile; version YAML timestamps are
# masked via yamlVolatile.

- id: tasks-create-due-today
  ticket: AB-272
  status: enforced
  method: POST
  path: /tasks
  auth: alice
  normalize: {ignore: ["/created_at", "/updated_at"]}
  body: {task: {user_id: 2, name: "Contract write task", bucket: due_today}}
  reset: true
  dbAssert:
    - {table: tasks, where: "id = 606", exclude: [custom_fields], volatile: [created_at, updated_at]}
    - {table: versions, where: "item_type = 'Task' AND item_id = 606", exclude: [id],
       volatile: [created_at],
       yamlVolatile: {object_changes: [created_at, updated_at, due_at]}}
  description: Task create (due_today bucket) → 201 + task JSON + create version.

