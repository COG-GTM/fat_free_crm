- id: activity-after-task-create-alice
  ticket: AB-273
  status: enforced
  path: /activities
  auth: alice
  reset: true
  normalize: {ignore: ["/*/created_at", "/*/updated_at"]}
  setup:
    - {method: POST, path: /tasks, body: {task: {user_id: 2, name: "Audit activity task", bucket: due_today}}}
  description: Phase-A task create is reflected in the activity feed.

