- id: activity-after-task-comment-alice
  ticket: AB-273
  status: enforced
  path: /activities
  auth: alice
  reset: true
  notes: "Rails records the Comment create version before Comment#subscribe_user_to_entity saves the Task (app/models/polymorphic/comment.rb:31-35); Spring CommentWriteService.create() preserves that callback order."
  normalize:
    ignore: ["/*/created_at", "/*/updated_at"]
    yamlVolatile: {"/*/object_changes": [created_at, updated_at]}
  setup:
    - {method: POST, path: /comments, body: {comment: {commentable_type: Task, commentable_id: 601,
        comment: "Audit task activity"}}}
  description: Phase-A task comment is reflected in the activity feed.

