- id: account-update-tag-list
  ticket: AB-273
  status: enforced
  method: PUT
  path: /accounts/101
  auth: alice
  reset: true
  body: {account: {tag_list: "alpha, beta"}}
  dbAssert:
    - {table: versions, where: "item_type = 'Account' AND item_id = 101",
       exclude: [id], volatile: [created_at],
       yamlVolatile: {object: [created_at, updated_at], object_changes: [created_at, updated_at]}}
  description: Account tag-list assignment records Rails TagList snapshots and nested changes.

