- id: activity-after-task-update-alice
  ticket: AB-273
  status: enforced
  path: /activities
  auth: alice
  reset: true
  notes: "Rails TasksController#update materializes attributes before update, so PaperTrail dumps column order; Spring TaskWriteService.update passes empty assignedOrder to match."
  normalize:
    ignore: ["/*/created_at", "/*/updated_at"]
    yamlVolatile: {"/*/object_changes": [updated_at]}
  setup:
    - {method: PUT, path: /tasks/601, body: {task: {name: "Audit activity updated"}}}
  description: Phase-A task update is reflected in the activity feed.

