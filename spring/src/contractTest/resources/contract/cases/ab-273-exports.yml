# AB-273 exports: Rails format.csv / format.xls list exports vs Spring content negotiation.
# compare: text diffs the exact body (CSV dialect, SpreadsheetML markup); Content-Type is compared as usual.
# Rails exports are unpaginated (app/controllers/entities_controller.rb get_list_of_records,
# `unless wants.xls? || wants.csv?` around paginate). Full byte parity incl. Content-Disposition is also
# replayed by RailsExportGoldenTest against rake ffcrm:migration:export_goldens.
- id: exports-accounts-csv-admin
  ticket: AB-273
  status: enforced
  path: /accounts
  compare: text
  rails: {path: /accounts.csv}
  spring: {accept: text/csv}
  auth: admin
  description: Accounts CSV via Accept text/csv (ExportCSV.from_array columns, cf_* columns, tags).
- id: exports-accounts-xls-alice
  ticket: AB-273
  status: enforced
  path: /accounts
  compare: text
  params: {format: xls}
  rails: {path: /accounts.xls}
  auth: alice
  description: Accounts SpreadsheetML via ?format=xls, scoped to alice (Account.my).
- id: exports-accounts-csv-search-alice
  ticket: AB-273
  status: enforced
  path: /accounts
  compare: text
  params: {query: a}
  rails: {path: /accounts.csv}
  spring: {path: /api/v1/accounts.csv}
  auth: alice
  description: Text search applies to the export; Spring .csv suffix path.
