allowlist:
  - id: authz-denied-401-vs-403
    match:
      method: "*"
      path: "**"
      authenticated: true
    kind: status
    status:
      rails: 401
      spring: 403
    reason: Spring authorization denials use 403 while Rails returns 401.
    reference: docs/migration/target-architecture.md §2.6
  - id: error-body-problem-json
    match:
      method: "*"
      path: "**"
    kind: errorBody
    reason: Spring errors use RFC 9457 problem+json while Rails errors use Rails response formats.
    reference: docs/migration/target-architecture.md §2.6
  - id: rails-vcard-contact-missing-406
    match:
      method: GET
      path: /contacts/999999.vcf
      case: contacts-vcard-missing
    kind: status
    status:
      rails: 406
      spring: 404
    reason: Rails respond_to_not_found omits vcf and returns 406; Spring preserves the read API's 404.
    reference: app/controllers/application_controller.rb#respond_to_not_found
  - id: rails-vcard-contact-denied-406
    match:
      method: GET
      path: /contacts/206.vcf
      case: contacts-vcard-denied
    kind: status
    status:
      rails: 406
      spring: 403
    reason: Rails respond_to_access_denied omits vcf and returns 406; Spring preserves the read API's 403.
    reference: app/controllers/application_controller.rb#respond_to_access_denied
  - id: rails-vcard-lead-missing-406
    match:
      method: GET
      path: /leads/999999.vcf
      case: leads-vcard-missing
    kind: status
    status:
      rails: 406
      spring: 404
    reason: Rails respond_to_not_found omits vcf and returns 406; Spring preserves the read API's 404.
    reference: app/controllers/application_controller.rb#respond_to_not_found
  - id: rails-vcard-lead-denied-406
    match:
      method: GET
      path: /leads/306.vcf
      case: leads-vcard-denied
    kind: status
    status:
      rails: 406
      spring: 403
    reason: Rails respond_to_access_denied omits vcf and returns 406; Spring preserves the read API's 403.
    reference: app/controllers/application_controller.rb#respond_to_access_denied
