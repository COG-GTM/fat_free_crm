allowlist:
  - id: authz-denied-401-vs-403
    match:
      method: "*"
      path: "**"
      authenticated: true
    kind: status
    status:
      rails: 401
      spring: 403
    reason: Spring authorization denials use 403 while Rails returns 401.
    reference: docs/migration/target-architecture.md §2.6
  - id: error-body-problem-json
    match:
      method: "*"
      path: "**"
    kind: errorBody
    reason: Spring errors use RFC 9457 problem+json while Rails errors use Rails response formats.
    reference: docs/migration/target-architecture.md §2.6
  - id: users-admin-authentication-token-omitted
    match:
      method: GET
      path: /admin/users
    kind: pointer
    pointer: /*/authentication_token
    rule: ignore
    reason: The Spring RailsJsonWriter never emits token columns.
    reference: AB-270 Phase B captured Rails user-list key set
  - id: activities-object-secrets-scrubbed
    match:
      method: GET
      path: /activities
    kind: pointer
    pointer: /*/object
    rule: ignore
    reason: Spring removes secret top-level YAML entries from version objects.
    reference: AB-270 Phase B ActivitiesControllerIntegrationTest
  - id: activities-object-changes-secrets-scrubbed
    match:
      method: GET
      path: /activities
    kind: pointer
    pointer: /*/object_changes
    rule: ignore
    reason: Spring removes secret top-level YAML entries from version change objects.
    reference: AB-270 Phase B ActivitiesControllerIntegrationTest
