name: Spring API

on:
  pull_request:
    paths:
      - "spring/**"
      - "docs/migration/openapi.yaml"
      - ".github/workflows/spring-api.yml"
      - "db/schema.rb"
      - "db/migrate/**"
      - "lib/tasks/ffcrm/legacy_auth_fixture.rake"
      - "lib/tasks/ffcrm/seed_fixture.rake"
      - "spec/lib/tasks/legacy_auth_fixture_spec.rb"
      - "spec/lib/tasks/seed_fixture_spec.rb"
  push:
    paths:
      - "spring/**"
      - "docs/migration/openapi.yaml"
      - ".github/workflows/spring-api.yml"
      - "db/schema.rb"
      - "db/migrate/**"
      - "lib/tasks/ffcrm/legacy_auth_fixture.rake"
      - "lib/tasks/ffcrm/seed_fixture.rake"
      - "spec/lib/tasks/legacy_auth_fixture_spec.rb"
      - "spec/lib/tasks/seed_fixture_spec.rb"

permissions:
  contents: read

concurrency:
  group: spring-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: spring
        run: ./gradlew build --no-daemon
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-build-reports
          path: spring/build/reports

  rails-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify generated Rails baseline
        run: spring/scripts/generate-baseline.sh --check

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate nginx gateway configuration
        run: >-
          docker run --rm --add-host web:127.0.0.1
          -v "$PWD/spring/gateway/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t
