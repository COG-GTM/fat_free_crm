name: Spring API

on:
  pull_request:
    paths:
      - "spring/**"
      - "docs/migration/openapi.yaml"
      - ".github/workflows/spring-api.yml"
      - "db/schema.rb"
      - "db/migrate/**"
      - "db/contract_fixtures.rb"
      - "app/**"
      - "config/routes.rb"
      - "lib/tasks/ffcrm/legacy_auth_fixture.rake"
      - "lib/tasks/ffcrm/entity_fixture.rake"
      - "spec/lib/tasks/legacy_auth_fixture_spec.rb"
      - "spec/lib/tasks/entity_fixture_spec.rb"
      - "lib/tasks/ffcrm/search_matrix.rake"
      - "spec/lib/tasks/search_matrix_spec.rb"
      - "app/models/users/ability.rb"
      - "lib/fat_free_crm/permissions.rb"
      - "lib/fat_free_crm/migration/authz_matrix.rb"
      - "lib/tasks/ffcrm/authz_matrix.rake"
      - "spec/lib/tasks/authz_matrix_spec.rb"
  push:
    paths:
      - "spring/**"
      - "docs/migration/openapi.yaml"
      - ".github/workflows/spring-api.yml"
      - "db/schema.rb"
      - "db/migrate/**"
      - "db/contract_fixtures.rb"
      - "app/**"
      - "config/routes.rb"
      - "lib/tasks/ffcrm/legacy_auth_fixture.rake"
      - "lib/tasks/ffcrm/entity_fixture.rake"
      - "spec/lib/tasks/legacy_auth_fixture_spec.rb"
      - "spec/lib/tasks/entity_fixture_spec.rb"
      - "lib/tasks/ffcrm/search_matrix.rake"
      - "spec/lib/tasks/search_matrix_spec.rb"
      - "app/models/users/ability.rb"
      - "lib/fat_free_crm/permissions.rb"
      - "lib/fat_free_crm/migration/authz_matrix.rb"
      - "lib/tasks/ffcrm/authz_matrix.rake"
      - "spec/lib/tasks/authz_matrix_spec.rb"

permissions:
  contents: read

concurrency:
  group: spring-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: spring
        run: ./gradlew build --no-daemon
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-build-reports
          path: spring/build/reports

  rails-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify generated Rails baseline
        run: spring/scripts/generate-baseline.sh --check

  contract-diff:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ffcrm_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BUNDLE_FROZEN: "false"
      CONTRACT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ffcrm_contract
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ffcrm_contract
      RAILS_ENV: development
      FFCRM_DB_URL: jdbc:postgresql://127.0.0.1:5432/ffcrm_contract
      FFCRM_DB_USER: postgres
      FFCRM_DB_PASSWORD: postgres
      FFCRM_JWT_SECRET: ab266-contract-ci-jwt-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Load contract database
        run: spring/scripts/contract-db.sh
      - name: Start Rails
        run: |
          mkdir -p spring/build/reports/contract-diff
          nohup bin/rails server -p 3000 -b 127.0.0.1 \
            > spring/build/reports/contract-diff/rails.log 2>&1 &
      - name: Build and start Spring
        working-directory: spring
        run: |
          ./gradlew bootJar --no-daemon
          nohup java -jar build/libs/fat-free-crm-api-0.1.0-SNAPSHOT.jar \
            > build/reports/contract-diff/spring.log 2>&1 &
      - name: Wait for Rails and Spring
        run: |
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/users/sign_in >/dev/null \
              && curl --silent --fail http://127.0.0.1:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat spring/build/reports/contract-diff/rails.log
            cat spring/build/reports/contract-diff/spring.log
            exit 1
          fi
      - name: Run contract diff
        working-directory: spring
        run: ./gradlew contractTest --no-daemon
      - name: Publish contract-diff report
        if: always()
        run: cat spring/build/reports/contract-diff/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload contract-diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-diff-report
          path: |
            spring/build/reports/contract-diff/report.json
            spring/build/reports/contract-diff/report.md
            spring/build/reports/contract-diff/rails.log
            spring/build/reports/contract-diff/spring.log

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate nginx gateway configuration
        run: >-
          docker run --rm --add-host web:127.0.0.1
          -v "$PWD/spring/gateway/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t
      - name: Validate enabled Accounts routing configuration
        run: |
          config="$RUNNER_TEMP/nginx-accounts.conf"
          cp spring/gateway/nginx.conf "$config"
          bash spring/gateway/routing.sh enable upstream accounts --file "$config"
          grep -Eq '^[[:space:]]*location ~ \^/api/v1/accounts' "$config"
          grep -Eq '^[[:space:]]*upstream spring_api' "$config"
          docker run --rm --add-host web:127.0.0.1 \
            --add-host host.docker.internal:127.0.0.1 \
            -v "$config:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

  authz-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FFCRM_ENTITY_FIXTURE: "1"
      SECRET_KEY_BASE: entity-fixture-only-secret-key-base-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Use PostgreSQL database.yml
        run: cp config/database.postgres.yml config/database.yml
      - name: Verify committed Rails authz matrix
        env:
          RAILS_ENV: development
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ffcrm_authz
        # Rails initializers query the database during boot, so db:create cannot create it.
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres ffcrm_authz
          bundle exec rails db:schema:load
          bundle exec rake ffcrm:migration:authz_matrix
          git diff --exit-code -- spring/src/test/resources/authz
      - name: Rails authz matrix spec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ffcrm_authz_test
        # Rails initializers query the database during boot, so db:create cannot create it.
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres ffcrm_authz_test
          bundle exec rails db:schema:load
          bundle exec rspec spec/lib/tasks/authz_matrix_spec.rb

  search-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FFCRM_ENTITY_FIXTURE: "1"
      SECRET_KEY_BASE: entity-fixture-only-secret-key-base-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Use PostgreSQL database.yml
        run: cp config/database.postgres.yml config/database.yml
      - name: Verify committed Rails search matrix
        env:
          RAILS_ENV: development
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ffcrm_search
        # Rails initializers query the database during boot, so db:create cannot create it.
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres ffcrm_search
          bundle exec rails db:schema:load
          bundle exec rake ffcrm:migration:search_matrix
          git diff --exit-code -- spring/src/test/resources/search
      - name: Rails search matrix spec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ffcrm_search_test
        # Rails initializers query the database during boot, so db:create cannot create it.
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres ffcrm_search_test
          bundle exec rails db:schema:load
          bundle exec rspec spec/lib/tasks/search_matrix_spec.rb spec/lib/tasks/search_matrix_opportunities_spec.rb
